<h1>나의 첫 웹페이지 파일!</h1>
<p>개발 공부가 점점 재미있어집니다.</p>
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      text-align: center; /* 글자들을 가운데로 정렬해 줘 */
      background-color: #f0f8ff; /* 배경색을 연한 파란색으로 해 줘 */
      font-family: sans-serif; /* 글꼴을 깔끔하게 바꿔 줘 */
      padding-top: 50px;
    }
    h1 {
      color: #333366; /* 제목 글자색을 남색으로 해 줘 */
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ff6b6b; /* 버튼을 예쁜 빨간색으로! */
      color: white; /* 버튼 안의 글자는 하얀색으로! */
      border: none;
      border-radius: 10px; /* 버튼 모서리를 둥글게 */
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>나의 첫 웹사이트에 오신 것을 환영합니다! 🎉</h1>
  <p>HTML과 CSS를 사용해서 화면을 예쁘게 꾸며보고 있어요.</p>
  <button>클릭해보세요!</button>
</body>
</html>
